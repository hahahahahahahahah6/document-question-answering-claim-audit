[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "document-question-answering-claim-audit"
version = "0.1.0"
description = "Offline static documentation claim auditor for scanned page capabilities"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
document-question-answering-claim-audit = "document_question_answering_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["document_question_answering_claim_audit*"]
